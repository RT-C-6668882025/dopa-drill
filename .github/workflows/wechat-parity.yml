name: WeChat migration parity
on:
  push:
    branches: [wechat-miniprogram]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Original application tests
        run: node --test tests/*.test.mjs
      - name: Mini Program static parity checks
        run: node scripts/check-miniprogram.mjs
